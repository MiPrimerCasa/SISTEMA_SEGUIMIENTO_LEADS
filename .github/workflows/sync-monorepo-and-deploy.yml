# Sync SISTEMA_SEGUIMIENTO_LEADS → encuesta-sorteo/leads/ → deploy VPS
#
# Secrets (Settings → Actions):
#   MONOREPO_PUSH_TOKEN — PAT con write en MiPrimerCasa/encuesta-sorteo
#   VPS_HOST, VPS_USER, VPS_SSH_KEY

name: Sync monorepo y deploy producción

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-leads-monorepo-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.miprimercasafsa-sorteo.com/leads

    steps:
      - name: Checkout CRM (este repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout monorepo encuesta-sorteo
        uses: actions/checkout@v4
        with:
          repository: MiPrimerCasa/encuesta-sorteo
          token: ${{ secrets.MONOREPO_PUSH_TOKEN }}
          path: encuesta-sorteo
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Preparar rama main (evita detached HEAD → exit 128)
        working-directory: encuesta-sorteo
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Sincronizar código a leads/
        run: |
          chmod +x scripts/sync-to-monorepo.sh
          bash scripts/sync-to-monorepo.sh . encuesta-sorteo

      - name: Commit y push en monorepo
        id: monorepo_push
        working-directory: encuesta-sorteo
        env:
          SRC_SHA: ${{ github.sha }}
          SRC_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A leads/
          if git diff --staged --quiet; then
            echo "Sin cambios en leads/ respecto al monorepo."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHORT="${SRC_SHA:0:7}"
          git commit -m "chore(leads): sync desde SISTEMA_SEGUIMIENTO_LEADS@${SHORT}" \
            -m "${SRC_MSG:-sync manual}"

          if ! git diff --quiet; then
            echo "::warning::Cambios sin commitear; se descartan para poder hacer rebase"
            git status --short
            git restore .
          fi

          git fetch origin main
          git rebase origin/main
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Empaquetar leads/ para VPS
        if: success()
        run: tar -czf leads-sync.tgz -C encuesta-sorteo leads

      - name: Subir leads al VPS
        if: success()
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: leads-sync.tgz
          target: /tmp/

      - name: Desplegar leads en VPS
        if: success()
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            MONOREPO_ROOT="${MONOREPO_ROOT:-/opt/encuesta-landingqr}"
            cd "$MONOREPO_ROOT"
            # Restaurar archivos de despliegue que el tar NO trae (porque se excluyen en sync-to-monorepo.sh).
            ENV_BACKUP=""
            DEPLOY_SCRIPT_BACKUP=""
            TRAEFIK_BACKUP=""

            if [[ -f leads/.env ]]; then
              ENV_BACKUP="$(mktemp)"
              cp -a leads/.env "$ENV_BACKUP"
            fi
            if [[ -f leads/deploy/deploy-vps-docker.sh ]]; then
              DEPLOY_SCRIPT_BACKUP="$(mktemp)"
              cp -a leads/deploy/deploy-vps-docker.sh "$DEPLOY_SCRIPT_BACKUP"
            fi
            if [[ -f leads/deploy/docker-compose.traefik-root.yml ]]; then
              TRAEFIK_BACKUP="$(mktemp)"
              cp -a leads/deploy/docker-compose.traefik-root.yml "$TRAEFIK_BACKUP"
            fi

            rm -rf leads
            tar -xzf /tmp/leads-sync.tgz -C "$MONOREPO_ROOT"
            rm -f /tmp/leads-sync.tgz

            if [[ -n "$ENV_BACKUP" && -f "$ENV_BACKUP" ]]; then
              mkdir -p leads
              cp -a "$ENV_BACKUP" leads/.env
              rm -f "$ENV_BACKUP"
            fi
            if [[ -n "$DEPLOY_SCRIPT_BACKUP" && -f "$DEPLOY_SCRIPT_BACKUP" ]]; then
              mkdir -p leads/deploy
              cp -a "$DEPLOY_SCRIPT_BACKUP" leads/deploy/deploy-vps-docker.sh
              rm -f "$DEPLOY_SCRIPT_BACKUP"
            fi
            if [[ -n "$TRAEFIK_BACKUP" && -f "$TRAEFIK_BACKUP" ]]; then
              mkdir -p leads/deploy
              cp -a "$TRAEFIK_BACKUP" leads/deploy/docker-compose.traefik-root.yml
              rm -f "$TRAEFIK_BACKUP"
            fi

            DEPLOY_SCRIPT="leads/deploy/deploy-vps-docker.sh"
            if [[ ! -f "$DEPLOY_SCRIPT" ]]; then
              echo "ERROR: no existe $DEPLOY_SCRIPT en el VPS (probablemente faltan archivos de despliegue del monorepo)."
              exit 1
            fi
            chmod +x "$DEPLOY_SCRIPT" 2>/dev/null || true
            export MONOREPO_ROOT SKIP_MONOREPO_GIT_PULL=1
            bash "$DEPLOY_SCRIPT"

      - name: Resumen
        if: always()
        run: |
          echo "## Sync + deploy CRM" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Campo | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repo origen | \`${{ github.repository }}\` @ \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Monorepo | [encuesta-sorteo](https://github.com/MiPrimerCasa/encuesta-sorteo) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cambios en leads/ | ${{ steps.monorepo_push.outputs.changed }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | https://www.miprimercasafsa-sorteo.com/leads |" >> "$GITHUB_STEP_SUMMARY"
