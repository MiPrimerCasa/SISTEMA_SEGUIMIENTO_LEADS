# Sync SISTEMA_SEGUIMIENTO_LEADS → encuesta-sorteo/leads/ → deploy VPS
#
# Secrets (Settings → Actions):
#   MONOREPO_PUSH_TOKEN — PAT con write en MiPrimerCasa/encuesta-sorteo
#   VPS_HOST, VPS_USER, VPS_SSH_KEY

name: Sync monorepo y deploy producción

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-leads-monorepo-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.miprimercasafsa-sorteo.com/leads

    steps:
      - name: Checkout CRM (este repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout monorepo encuesta-sorteo
        uses: actions/checkout@v4
        with:
          repository: MiPrimerCasa/encuesta-sorteo
          token: ${{ secrets.MONOREPO_PUSH_TOKEN }}
          path: encuesta-sorteo
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Preparar rama main (evita detached HEAD → exit 128)
        working-directory: encuesta-sorteo
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Sincronizar código a leads/
        run: |
          chmod +x scripts/sync-to-monorepo.sh
          bash scripts/sync-to-monorepo.sh . encuesta-sorteo

      - name: Commit y push en monorepo
        id: monorepo_push
        working-directory: encuesta-sorteo
        env:
          SRC_SHA: ${{ github.sha }}
          SRC_MSG: ${{ github.event.head_commit.message }}
          MONOREPO_PUSH_TOKEN: ${{ secrets.MONOREPO_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${MONOREPO_PUSH_TOKEN}@github.com/MiPrimerCasa/encuesta-sorteo.git"

          git add -A leads/
          if git diff --staged --quiet; then
            echo "Sin cambios en leads/ respecto al monorepo."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHORT="${SRC_SHA:0:7}"
          git commit -m "chore(leads): sync desde SISTEMA_SEGUIMIENTO_LEADS@${SHORT}" \
            -m "${SRC_MSG:-sync manual}"

          git reset --hard HEAD
          git fetch origin main
          git rebase origin/main
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy leads en VPS
        if: success()
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            MONOREPO_ROOT="${MONOREPO_ROOT:-/opt/encuesta-landingqr}"
            if [[ ! -d "$MONOREPO_ROOT/.git" ]]; then
              echo "ERROR: $MONOREPO_ROOT no es un repo git"
              exit 1
            fi
            cd "$MONOREPO_ROOT"
            git config --global --add safe.directory "$MONOREPO_ROOT" 2>/dev/null || true
            git checkout -f main 2>/dev/null || git checkout -fB main origin/main
            git reset --hard HEAD
            git clean -fd -e .env -e 'leads/.env' 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            DEPLOY_SCRIPT="leads/deploy/deploy-vps-docker.sh"
            if [[ ! -f "$DEPLOY_SCRIPT" ]]; then
              DEPLOY_SCRIPT="deploy/deploy-vps-docker.sh"
            fi
            chmod +x deploy/ensure-leads-env.sh "$DEPLOY_SCRIPT" 2>/dev/null || true
            export MONOREPO_ROOT SKIP_MONOREPO_GIT_PULL=1
            bash deploy/ensure-leads-env.sh 2>/dev/null || true
            bash "$DEPLOY_SCRIPT"

      - name: Resumen
        if: always()
        run: |
          echo "## Sync + deploy CRM" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Campo | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repo origen | \`${{ github.repository }}\` @ \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Monorepo | [encuesta-sorteo](https://github.com/MiPrimerCasa/encuesta-sorteo) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cambios en leads/ | ${{ steps.monorepo_push.outputs.changed }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | https://www.miprimercasafsa-sorteo.com/leads |" >> "$GITHUB_STEP_SUMMARY"
