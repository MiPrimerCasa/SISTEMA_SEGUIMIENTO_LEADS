# Sync SISTEMA_SEGUIMIENTO_LEADS → encuesta-sorteo/leads/ → deploy VPS
#
# Secrets (Settings → Actions):
#   MONOREPO_PUSH_TOKEN — PAT fine-grained: Contents + Workflows (write) en encuesta-sorteo
#   VPS_HOST, VPS_USER, VPS_SSH_KEY

name: Sync monorepo y deploy producción

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-leads-monorepo-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Debe pasar antes de tocar el monorepo (activar "Require status checks" en main).
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  sync-and-deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.miprimercasafsa-sorteo.com/leads

    steps:
      - name: Checkout CRM (este repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout monorepo encuesta-sorteo
        uses: actions/checkout@v4
        with:
          repository: MiPrimerCasa/encuesta-sorteo
          token: ${{ secrets.MONOREPO_PUSH_TOKEN }}
          path: encuesta-sorteo
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Preparar rama main (evita detached HEAD → exit 128)
        working-directory: encuesta-sorteo
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Sincronizar código a leads/
        run: |
          chmod +x scripts/sync-to-monorepo.sh
          bash scripts/sync-to-monorepo.sh . encuesta-sorteo

      - name: Sincronizar workflow deploy-leads al monorepo
        run: |
          mkdir -p encuesta-sorteo/.github/workflows
          cp deploy/github-workflow/deploy-leads.yml encuesta-sorteo/.github/workflows/deploy-leads.yml

      - name: Commit y push en monorepo
        id: monorepo_push
        working-directory: encuesta-sorteo
        env:
          SRC_SHA: ${{ github.sha }}
          SRC_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A leads/ .github/workflows/deploy-leads.yml
          if git diff --staged --quiet; then
            echo "Sin cambios en leads/ respecto al monorepo."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHORT="${SRC_SHA:0:7}"
          git commit -m "chore(leads): sync desde SISTEMA_SEGUIMIENTO_LEADS@${SHORT}" \
            -m "${SRC_MSG:-sync manual}"

          # Reintentos por si GitHub falla transientemente en commit_refs
          for attempt in 1 2 3 4 5; do
            if git push origin main 2>&1; then
              echo "Push OK en intento ${attempt}"
              break
            fi
            if [[ $attempt -eq 5 ]]; then
              echo "Error: push fallido tras 5 intentos"
              exit 1
            fi
            echo "Intento ${attempt} fallido — reintentando en $((attempt * 20))s..."
            sleep $((attempt * 20))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # El push a encuesta-sorteo/main dispara deploy-leads.yml en ese repo (igual que la encuesta).
          # No se necesita SCP ni SSH desde acá.

      - name: Resumen
        if: always()
        run: |
          echo "## Sync + deploy CRM" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Campo | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repo origen | \`${{ github.repository }}\` @ \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Monorepo | [encuesta-sorteo](https://github.com/MiPrimerCasa/encuesta-sorteo) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cambios en leads/ | ${{ steps.monorepo_push.outputs.changed }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy VPS | Disparado desde [encuesta-sorteo](https://github.com/MiPrimerCasa/encuesta-sorteo/actions) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | https://www.miprimercasafsa-sorteo.com/leads |" >> "$GITHUB_STEP_SUMMARY"
