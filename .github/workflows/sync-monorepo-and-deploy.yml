# Sync SISTEMA_SEGUIMIENTO_LEADS → encuesta-sorteo/leads/
# El deploy al VPS lo hace el monorepo (igual que la encuesta): push a main en
# encuesta-sorteo dispara .github/workflows/deploy-leads.yml con git pull + Docker.
#
# Secrets en ESTE repo:
#   MONOREPO_PUSH_TOKEN — PAT con write en MiPrimerCasa/encuesta-sorteo
#
# Secrets SSH (VPS_HOST, VPS_USER, VPS_SSH_KEY) van en encuesta-sorteo, no aquí.

name: Sync monorepo (deploy vía encuesta-sorteo)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-leads-monorepo-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.miprimercasafsa-sorteo.com/leads

    steps:
      - name: Checkout CRM (este repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout monorepo encuesta-sorteo
        uses: actions/checkout@v4
        with:
          repository: MiPrimerCasa/encuesta-sorteo
          token: ${{ secrets.MONOREPO_PUSH_TOKEN }}
          path: encuesta-sorteo
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Preparar rama main (evita detached HEAD → exit 128)
        working-directory: encuesta-sorteo
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Sincronizar código a leads/
        run: |
          chmod +x scripts/sync-to-monorepo.sh
          bash scripts/sync-to-monorepo.sh . encuesta-sorteo

      - name: Sincronizar workflow deploy-leads al monorepo
        run: |
          mkdir -p encuesta-sorteo/.github/workflows
          cp deploy/github-workflow/deploy-leads.yml encuesta-sorteo/.github/workflows/deploy-leads.yml

      - name: Commit y push en monorepo
        id: monorepo_push
        working-directory: encuesta-sorteo
        env:
          SRC_SHA: ${{ github.sha }}
          SRC_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A leads/ .github/workflows/deploy-leads.yml
          if git diff --staged --quiet; then
            echo "Sin cambios en leads/ respecto al monorepo."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHORT="${SRC_SHA:0:7}"
          git commit -m "chore(leads): sync desde SISTEMA_SEGUIMIENTO_LEADS@${SHORT}" \
            -m "${SRC_MSG:-sync manual}"

          if ! git diff --quiet; then
            echo "::warning::Cambios sin commitear; se descartan para poder hacer rebase"
            git status --short
            git restore .
          fi

          git fetch origin main
          git rebase origin/main
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Resumen
        if: always()
        run: |
          echo "## Sync + deploy CRM" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Campo | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repo origen | \`${{ github.repository }}\` @ \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Monorepo | [encuesta-sorteo](https://github.com/MiPrimerCasa/encuesta-sorteo) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cambios en leads/ | ${{ steps.monorepo_push.outputs.changed }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy VPS | Automático en [encuesta-sorteo](https://github.com/MiPrimerCasa/encuesta-sorteo/actions) si hubo push a \`leads/**\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | https://www.miprimercasafsa-sorteo.com/leads |" >> "$GITHUB_STEP_SUMMARY"
