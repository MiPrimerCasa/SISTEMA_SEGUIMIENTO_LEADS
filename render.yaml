# Blueprint Render — pruebas rápidas (un solo Web Service: API + frontend estático).
# Dashboard: New > Blueprint > conectar repo SISTEMA_SEGUIMIENTO_LEADS
#
# Requisito: SQL Server accesible desde internet (IP de Render en firewall del hosting SQL).

services:
  - type: web
    name: seguimiento-leads
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      # --- SQL Server (completar en Render o aquí) ---
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: '1433'
      - key: DB_NAME
        sync: false
      - key: ENCUESTAS_DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_ENCRYPT
        value: 'false'
      - key: DB_TRUST_CERT
        value: 'true'
      # --- Stored procedures ---
      - key: SP_LOGIN
        value: dbo.operadorAccesoCategoria
      - key: SP_LOGIN_PARAM_USER
        value: LoginID
      - key: SP_LOGIN_PARAM_PASS
        value: PasID
      - key: SP_ENCUESTAS
        value: encuestasMuestraOperador
      - key: SP_ENCUESTAS_PARAM_ID
        value: idVendedor
